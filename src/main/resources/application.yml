spring:
  application:
    name: dataingest

  cloud:
    azure:
      # 2. Event Hubs Passwordless Config
      eventhubs:
        namespace: ${AZURE_EVENTHUBS_NAMESPACE}
        event-hub-name: ${AZURE_EVENTHUBS_NAME}
        processor:
          checkpoint-store:
            container-name: ${STORAGE_CONTAINER_CHECKPOINT:checkpoint}
            account-name: ${AZURE_STORAGE_ACCOUNT}

      # 3. Cosmos DB Passwordless Config
      cosmos:
        endpoint: ${AZURE_COSMOS_ENDPOINT}
        database: ${AZURE_COSMOS_DATABASE}
