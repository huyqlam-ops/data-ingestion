name: Deploy to Azure Container Apps

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: dataingest

jobs:
  deploy:
    name: Deploy release to Azure Container Apps
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.fqdn }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new revision to Azure Container Apps
        id: deploy
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ secrets.CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}
          targetPort: 8080

      - name: Print deployed version
        run: echo "Đã deploy image ${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }} lên Azure Container Apps"