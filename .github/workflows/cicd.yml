name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  call-deploy-workflow:
    uses: huyqlam-ops/shared-workflow/.github/workflows/cicd.yml@main
    with:
      image_name: 'dataingest'
      container_name: 'ingest'
      java_version: '25'
      environment_name: 'dev'
    secrets: inherit